<header class="sticky top-0 z-10 border-b border-border bg-background/90 backdrop-blur">
  <div class="flex h-16 w-full items-center justify-between px-5 sm:px-8">
    <div class="flex items-center gap-3">
      <span
        class="grid size-9 place-items-center rounded-lg bg-primary text-base font-bold text-primary-foreground"
        aria-hidden="true"
      >
        P
      </span>
      <span class="text-sm font-semibold tracking-tight">People App</span>
    </div>

    <div class="flex items-center gap-3">
      <span id="theme-label" class="text-sm font-medium text-foreground">Dark mode</span>
      <button
        type="button"
        role="switch"
        aria-labelledby="theme-label"
        [attr.aria-checked]="isDark()"
        (click)="toggleTheme()"
        class="inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent bg-input transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring aria-checked:bg-primary"
      >
        <span
          class="pointer-events-none block size-5 rounded-full bg-background shadow-sm ring-0 transition-transform"
          [class.translate-x-0]="!isDark()"
          [class.translate-x-5]="isDark()"
        ></span>
      </button>
    </div>
  </div>
</header>
